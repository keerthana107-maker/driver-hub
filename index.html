<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DriverHub - Driver Recruitment Platform</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --dark: #0f172a;
    --text: #1e293b;
    --muted: #64748b;
    --light: #f1f5f9;
    --white: #ffffff;
    --green: #16a34a;
    --orange: #f59e0b;
    --red: #dc2626;
    --border: #e2e8f0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f8fafc;
    color: var(--text);
    line-height: 1.5;
}

/* =========================
   NAVBAR
========================= */

.navbar {
    height: 72px;
    background: white;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6%;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo {
    font-size: 25px;
    font-weight: 800;
    color: var(--primary);
    cursor: pointer;
}

.logo span {
    color: var(--dark);
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 24px;
}

.nav-links a {
    color: var(--text);
    text-decoration: none;
    cursor: pointer;
    font-weight: 500;
}

.nav-links a:hover {
    color: var(--primary);
}

.nav-btn {
    background: var(--primary);
    color: white !important;
    padding: 10px 18px;
    border-radius: 8px;
}

.nav-btn:hover {
    background: var(--primary-dark);
}

.user-area {
    display: none;
    align-items: center;
    gap: 12px;
}

.user-name {
    font-weight: 600;
}

.logout-btn {
    border: none;
    background: #fee2e2;
    color: #b91c1c;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
}

/* =========================
   HERO
========================= */

.hero {
    background:
        linear-gradient(
            rgba(15, 23, 42, 0.90),
            rgba(15, 23, 42, 0.90)
        ),
        linear-gradient(135deg, #2563eb, #0f172a);

    color: white;
    padding: 90px 6%;
}

.hero-content {
    max-width: 1100px;
    margin: auto;
    text-align: center;
}

.hero h1 {
    font-size: 48px;
    line-height: 1.1;
    margin-bottom: 20px;
}

.hero h1 span {
    color: #60a5fa;
}

.hero p {
    color: #cbd5e1;
    font-size: 19px;
    margin-bottom: 35px;
}

.search-container {
    background: white;
    padding: 12px;
    border-radius: 12px;
    display: flex;
    gap: 10px;
    max-width: 1000px;
    margin: auto;
}

.search-container input,
.search-container select {
    flex: 1;
    border: none;
    outline: none;
    padding: 15px;
    font-size: 15px;
    color: var(--text);
}

.search-container button {
    background: var(--primary);
    border: none;
    color: white;
    padding: 0 25px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.search-container button:hover {
    background: var(--primary-dark);
}

/* =========================
   STATS
========================= */

.stats {
    background: white;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    padding: 35px 6%;
    gap: 20px;
    border-bottom: 1px solid var(--border);
}

.stat {
    text-align: center;
}

.stat h2 {
    color: var(--primary);
    font-size: 30px;
}

.stat p {
    color: var(--muted);
}

/* =========================
   GENERAL
========================= */

.container {
    width: 88%;
    max-width: 1200px;
    margin: auto;
}

.section {
    padding: 60px 0;
}

.section-title {
    margin-bottom: 30px;
}

.section-title h2 {
    font-size: 30px;
}

.section-title p {
    color: var(--muted);
}

.hidden {
    display: none !important;
}

/* =========================
   JOB CARDS
========================= */

.job-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
}

.job-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    transition: 0.2s;
}

.job-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
}

.job-icon {
    width: 50px;
    height: 50px;
    background: #eff6ff;
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-size: 25px;
    margin-bottom: 15px;
}

.job-card h3 {
    font-size: 20px;
    margin-bottom: 7px;
}

.company {
    color: var(--primary);
    font-weight: bold;
}

.job-info {
    margin: 15px 0;
}

.job-info p {
    color: var(--muted);
    margin: 6px 0;
}

.tags {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    margin: 15px 0;
}

.tag {
    background: #f1f5f9;
    color: #475569;
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px;
}

.salary {
    color: var(--green);
    font-size: 18px;
    font-weight: bold;
}

.primary-btn {
    width: 100%;
    border: none;
    background: var(--primary);
    color: white;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.primary-btn:hover {
    background: var(--primary-dark);
}

.secondary-btn {
    border: 1px solid var(--border);
    background: white;
    color: var(--text);
    padding: 11px 18px;
    border-radius: 8px;
    cursor: pointer;
}

/* =========================
   AUTH
========================= */

.auth-page {
    min-height: calc(100vh - 72px);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 50px 20px;
}

.auth-card {
    background: white;
    width: 430px;
    max-width: 100%;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 10px 35px rgba(15, 23, 42, 0.10);
}

.auth-card h2 {
    margin-bottom: 8px;
}

.auth-card > p {
    color: var(--muted);
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 17px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    font-size: 14px;
}

.form-control {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    outline: none;
    font-size: 15px;
}

.form-control:focus {
    border-color: var(--primary);
}

.auth-card .primary-btn {
    margin-top: 8px;
}

.auth-switch {
    text-align: center;
    margin-top: 20px;
    color: var(--muted);
}

.auth-switch a {
    color: var(--primary);
    font-weight: bold;
    cursor: pointer;
}

/* =========================
   DASHBOARD
========================= */

.dashboard {
    padding: 45px 0;
}

.dashboard-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.dashboard-header h1 {
    font-size: 30px;
}

.dashboard-header p {
    color: var(--muted);
}

.dashboard-cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 35px;
}

.dashboard-card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    border: 1px solid var(--border);
}

.dashboard-card h3 {
    color: var(--muted);
    font-size: 14px;
}

.dashboard-card strong {
    font-size: 30px;
    display: block;
    margin-top: 8px;
}

/* =========================
   APPLICATIONS
========================= */

.application-card {
    background: white;
    border: 1px solid var(--border);
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 15px;
}

.application-header {
    display: flex;
    justify-content: space-between;
    gap: 15px;
}

.status {
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.status-review {
    background: #fef3c7;
    color: #92400e;
}

.status-shortlisted {
    background: #dcfce7;
    color: #166534;
}

.status-rejected {
    background: #fee2e2;
    color: #991b1b;
}

.contact-box {
    margin-top: 15px;
    padding: 15px;
    background: #eff6ff;
    border-radius: 10px;
}

.contact-box a {
    color: var(--primary);
    font-weight: bold;
    text-decoration: none;
}

/* =========================
   JOB DETAIL
========================= */

.detail-card {
    background: white;
    padding: 35px;
    border-radius: 15px;
    border: 1px solid var(--border);
}

.detail-header {
    display: flex;
    justify-content: space-between;
    gap: 20px;
}

.detail-header h1 {
    font-size: 32px;
}

.detail-section {
    margin-top: 30px;
}

.detail-section h3 {
    margin-bottom: 10px;
}

.detail-section p {
    color: var(--muted);
}

/* =========================
   FILTERS
========================= */

.filters {
    background: white;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-bottom: 30px;
}

.filter-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

/* =========================
   ADMIN
========================= */

.admin-table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 10px;
    overflow: hidden;
}

.admin-table th,
.admin-table td {
    padding: 15px;
    text-align: left;
    border-bottom: 1px solid var(--border);
}

.admin-table th {
    background: #f8fafc;
}

.delete-btn {
    background: #fee2e2;
    color: #b91c1c;
    border: none;
    padding: 7px 12px;
    border-radius: 7px;
    cursor: pointer;
}

/* =========================
   FOOTER
========================= */

footer {
    background: var(--dark);
    color: white;
    padding: 40px 6%;
    margin-top: 60px;
}

.footer-content {
    max-width: 1200px;
    margin: auto;
    display: flex;
    justify-content: space-between;
}

footer p {
    color: #94a3b8;
}

/* =========================
   MODAL
========================= */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.65);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    padding: 20px;
}

.modal-content {
    width: 550px;
    max-width: 100%;
    background: white;
    border-radius: 15px;
    padding: 30px;
    max-height: 90vh;
    overflow-y: auto;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

.close-btn {
    border: none;
    background: #f1f5f9;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    cursor: pointer;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width: 900px) {

    .job-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .dashboard-cards {
        grid-template-columns: repeat(2, 1fr);
    }

    .filter-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 600px) {

    .navbar {
        padding: 0 20px;
    }

    .nav-links {
        display: none;
    }

    .hero {
        padding: 60px 20px;
    }

    .hero h1 {
        font-size: 35px;
    }

    .search-container {
        flex-direction: column;
    }

    .search-container button {
        padding: 14px;
    }

    .stats {
        grid-template-columns: 1fr 1fr;
        padding: 25px;
    }

    .job-grid {
        grid-template-columns: 1fr;
    }

    .dashboard-cards {
        grid-template-columns: 1fr 1fr;
    }

    .filter-grid {
        grid-template-columns: 1fr;
    }

    .detail-header {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar">

    <div class="logo" onclick="showHome()">
        🚗 Driver<span>Hub</span>
    </div>

    <div class="nav-links">

<!-- =========================

========================= -->

<main id="app"></main>

========================= -->

<footer>

/* =====================================================
   LOCAL STORAGE
===================================================== */

function getJobs() {

    const savedJobs = localStorage.getItem("driverHubJobs");

    if (savedJobs) {
        return JSON.parse(savedJobs);
    }

    localStorage.setItem(
        "driverHubJobs",
        JSON.stringify(defaultJobs)
    );

    return defaultJobs;
}


function saveJobs(jobs) {

    localStorage.setItem(
        "driverHubJobs",
        JSON.stringify(jobs)
    );

}


function getUsers() {

    return JSON.parse(
        localStorage.getItem("driverHubUsers") || "[]"
    );

}


function saveUsers(users) {

    localStorage.setItem(
        "driverHubUsers",
        JSON.stringify(users)
    );

}


function getApplications() {

    return JSON.parse(
        localStorage.getItem("driverHubApplications") || "[]"
    );

}


function saveApplications(applications) {

    localStorage.setItem(
        "driverHubApplications",
        JSON.stringify(applications)
    );

}


function getCurrentUser() {

    return JSON.parse(
        localStorage.getItem("driverHubCurrentUser") || "null"
    );

}


/* =====================================================
   UTILITY
===================================================== */

function formatSalary(amount) {

    return Number(amount).toLocaleString("en-IN");

}


function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =====================================================
   NAVIGATION
===================================================== */

function showHome() {

    renderHome();

    window.scrollTo(0, 0);

}


function showJobs() {

    renderJobs();

    window.scrollTo(0, 0);

}


function showLogin() {

    renderLogin();

    window.scrollTo(0, 0);

}


function showRegister() {

    renderRegister();

    window.scrollTo(0, 0);

}


function showApplications() {

    const user = getCurrentUser();

    if (!user) {

        alert("Please login before viewing your applications.");

        showLogin();

        return;

    }

    renderApplications();

}


function showEmployer() {

    const user = getCurrentUser();

    if (!user) {

        alert("Please login first.");

        showLogin();

        return;

    }

    renderEmployer();

}


function showAdminLogin() {

    renderAdminLogin();

}


/* =====================================================
   HOME
===================================================== */

function renderHome() {

    const jobs = getJobs();

    document.getElementById("app").innerHTML = `

        <section class="hero">

            <div class="hero-content">

                <h1>
                    Find Your Next
                    <span>Driving Job</span>
                </h1>

                <p>
                    DriverHub connects professional drivers
                    with trusted employers across India.
                </p>

                <div class="search-container">

                    <input
                        id="homeSearch"
                        placeholder="Job title or company"
                    >

                    <select id="homeCity">

                        <option value="">
                            All Cities
                        </option>

                        ${getCities()
                            .map(city =>
                                `<option value="${escapeHTML(city)}">${escapeHTML(city)}</option>`
                            )
                            .join("")}

                    </select>

                    <button onclick="homeSearch()">
                        Search Jobs
                    </button>

                </div>

            </div>

        </section>


        <section class="stats">

            <div class="stat">
                <h2>${jobs.length}+</h2>
                <p>Available Jobs</p>
            </div>

            <div class="stat">
                <h2>10K+</h2>
                <p>Drivers</p>
            </div>

            <div class="stat">
                <h2>2K+</h2>
                <p>Employers</p>
            </div>

            <div class="stat">
                <h2>25+</h2>
                <p>Cities</p>
            </div>

        </section>


        <section class="section">

            <div class="container">

                <div class="section-title">

                    <h2>Latest Driver Jobs</h2>

                    <p>
                        Find opportunities based on your
                        city, experience and salary expectations.
                    </p>

                </div>

                <div class="job-grid">

                    ${jobs.slice(0, 6)
                        .map(jobCard)
                        .join("")}

                </div>

            </div>

        </section>

    `;

}


/* =====================================================
   HOME SEARCH
===================================================== */

function homeSearch() {

    const keyword =
        document.getElementById("homeSearch").value;

    const city =
        document.getElementById("homeCity").value;

    renderJobs(keyword, city);

}


/* =====================================================
   CITIES
===================================================== */

function getCities() {

    const jobs = getJobs();

    return [...new Set(
        jobs.map(job => job.city)
    )];

}


/* =====================================================

/* =====================================================
   FILTER JOBS
===================================================== */

function filterJobs() {

    const keyword =
        document.getElementById("jobKeyword")
        .value
        .toLowerCase();

    const city =
        document.getElementById("jobCity").value;

    const experience =
        Number(
            document.getElementById("jobExperience").value
        ) || 0;

    const salary =
        Number(
            document.getElementById("jobSalary").value
        ) || 0;


    const jobs = getJobs();

    const filtered = jobs.filter(job => {

        const matchesKeyword =
            !keyword ||
            job.title.toLowerCase().includes(keyword) ||
            job.company.toLowerCase().includes(keyword);

        const matchesCity =
            !city ||
            job.city === city;

        const matchesExperience =
            !experience ||
            job.experience <= experience;

        const matchesSalary =
            !salary ||
            job.salaryMax >= salary;

        return (
            matchesKeyword &&
            matchesCity &&
            matchesExperience &&
            matchesSalary
        );

    });


    document.getElementById("jobResults").innerHTML =

        filtered.length

        ?

        filtered.map(jobCard).join("")

        :

        `
            <div style="
                grid-column:1/-1;
                background:white;
                padding:40px;
                border-radius:12px;
                text-align:center;
            ">

                <h3>No jobs found</h3>

                <p style="color:#64748b">
                    Try changing your search filters.
                </p>

            </div>
        `;

}

/* =====================================================
   APPLY
===================================================== */

function applyForJob(jobId) {

    const user = getCurrentUser();


    if (!user) {

        alert(
            "Please login or register before applying."
        );

        showLogin();

        return;

    }


    if (user.role !== "driver") {

        alert(
            "Only driver accounts can apply for jobs."
        );

        return;

    }


    const applications = getApplications();


    const alreadyApplied =
        applications.find(
            application =>
                application.jobId === jobId &&
                application.userEmail === user.email
        );


    if (alreadyApplied) {

        alert(
            "You have already applied for this job."
        );

        showApplications();

        return;

    }


    const jobs = getJobs();

    const job = jobs.find(j => j.id === jobId);


    const application = {

        id: Date.now(),

        jobId: job.id,

        jobTitle: job.title,

        company: job.company,

        city: job.city,

        userEmail: user.email,

        userName: user.name,

        status: "Under Review",

        appliedAt:
            new Date().toLocaleDateString("en-IN")

    };


    applications.push(application);

    saveApplications(applications);


    alert(
        "Application submitted successfully!"
    );


    showApplications();

}

/* =====================================================
   REGISTER USER
===================================================== */

function registerUser(event) {

    event.preventDefault();


    const users = getUsers();


    const email =
        document.getElementById("registerEmail")
        .value
        .toLowerCase()
        .trim();


    if (
        users.some(
            user => user.email === email
        )
    ) {

        alert(
            "An account with this email already exists."
        );

        return;

    }


    const user = {

        id: Date.now(),

        name:
            document.getElementById("registerName")
            .value
            .trim(),

        email,

        phone:
            document.getElementById("registerPhone")
            .value
            .trim(),

        password:
            document.getElementById("registerPassword")
            .value,

        city:
            document.getElementById("registerCity")
            .value,

        experience:
            Number(
                document.getElementById("registerExperience")
                .value
            ),

        category:
            document.getElementById("registerCategory")
            .value,

        role: "driver"

    };


    users.push(user);

    saveUsers(users);


    alert(
        "Registration successful! Please login."
    );


    showLogin();

}


/* =====================================================
   LOGIN USER
===================================================== */

function loginUser(event) {

    event.preventDefault();


    const email =
        document.getElementById("loginEmail")
        .value
        .toLowerCase()
        .trim();


    const password =
        document.getElementById("loginPassword")
        .value;


    const users = getUsers();


    const user = users.find(
        u =>
            u.email === email &&
            u.password === password
    );


    if (!user) {

        alert(
            "Invalid email or password."
        );

        return;

    }


    localStorage.setItem(
        "driverHubCurrentUser",
        JSON.stringify(user)
    );


    updateNavbar();

    alert(
        "Login successful!"
    );


    showHome();

}


/* =====================================================
   LOGOUT
===================================================== */

function logout() {

    localStorage.removeItem(
        "driverHubCurrentUser"
    );

    updateNavbar();

    showHome();

}


/* =====================================================
   NAVBAR UPDATE
===================================================== */

function updateNavbar() {

    const user = getCurrentUser();


    const loginNav =
        document.getElementById("loginNav");

    const registerNav =
        document.getElementById("registerNav");

    const userArea =
        document.getElementById("userArea");

    const navUserName =
        document.getElementById("navUserName");


    if (user) {

        loginNav.style.display = "none";

        registerNav.style.display = "none";

        userArea.style.display = "flex";

        navUserName.textContent =
            "👤 " + user.name;

    } else {

        loginNav.style.display = "block";

        registerNav.style.display = "block";

        userArea.style.display = "none";

    }

}

    return `

                    <p class="company">

                            class="form-control"
                            type="email"
                            placeholder="hr@company.com"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Description
                        </label>

                        <textarea
                            id="newDescription"
                            class="form-control"
                            rows="4"
                            required
                        ></textarea>

                    </div>


                    <div class="form-group">

                        <label>
                            Requirements
                        </label>

                        <textarea
                            id="newRequirements"
                            class="form-control"
                            rows="4"
                            required
                        ></textarea>

                    </div>


                    <button
                        class="primary-btn"
                        type="submit"
                    >
                        Publish Job
                    </button>

                </form>

            </div>

        </section>

    `;

}


/* =====================================================
   CREATE JOB
===================================================== */

function createJob(event) {

    event.preventDefault();


    const jobs =
        getJobs();


    const newJob = {

        id: Date.now(),

        title:
            document.getElementById("newTitle").value,

        company:
            document.getElementById("newCompany").value,

        city:
            document.getElementById("newCity").value,

        state:
            document.getElementById("newState").value,

        experience:
            Number(
                document.getElementById("newExperience").value
            ),

        salaryMin:
            Number(
                document.getElementById("newSalaryMin").value
            ),

        salaryMax:
            Number(
                document.getElementById("newSalaryMax").value
            ),

        type: "Full Time",

        category:
            document.getElementById("newCategory").value,

        hours: "Flexible",

        description:
            document.getElementById("newDescription").value,

        requirements:
            document.getElementById("newRequirements").value,

        contactName: "Employer",

        contactPhone:
            document.getElementById("newPhone").value,

        contactEmail:
            document.getElementById("newEmail").value

    };


    jobs.push(newJob);

    saveJobs(jobs);


    alert(
        "Job posted successfully!"
    );


    showJobs();

}

/* =====================================================

===================================================== */

function adminLogin(event) {

    event.preventDefault();


    const email =
        document.getElementById("adminEmail").value;


    const password =
        document.getElementById("adminPassword").value;


    if (
        email === "admin@driverhub.com" &&
        password === "Admin@123"
    ) {

        localStorage.setItem(
            "driverHubAdmin",
            "true"
        );


        renderAdminDashboard();

    } else {

        alert(
            "Invalid admin credentials."
        );

    }

}


/* =====================================================
   ADMIN DASHBOARD
===================================================== */

function renderAdminDashboard() {

    const jobs = getJobs();

    const users = getUsers();

    const applications =
        getApplications();


    document.getElementById("app").innerHTML = `

        <section class="section">

            <div class="container">

                <div class="dashboard-header">

                    <div>

                        <h1>
                            Admin Dashboard
                        </h1>

                        <p>
                            Manage DriverHub
                        </p>

                    </div>

                    <button
                        class="secondary-btn"
                        onclick="adminLogout()"
                    >
                        Admin Logout
                    </button>

                </div>


                <div class="dashboard-cards">

                    <div class="dashboard-card">

                        <h3>
                            Drivers
                        </h3>

                        <strong>
                            ${
                                users.filter(
                                    u =>
                                        u.role === "driver"
                                ).length
                            }
                        </strong>

                    </div>


                    <div class="dashboard-card">

                        <h3>
                            Employers
                        </h3>

                        <strong>
                            ${
                                users.filter(
                                    u =>
                                        u.role === "employer"
                                ).length
                            }
                        </strong>

                    </div>


                    <div class="dashboard-card">

                        <h3>
                            Jobs
                        </h3>

                        <strong>
                            ${jobs.length}
                        </strong>

                    </div>


                    <div class="dashboard-card">

                        <h3>
                            Applications
                        </h3>

                        <strong>
                            ${applications.length}
                        </strong>

                    </div>

                </div>


                <h2>
                    Manage Jobs
                </h2>

                <br>


                <table class="admin-table">

                    <thead>

                        <tr>

                            <th>
                                Job
                            </th>

                            <th>
                                Company
                            </th>

                            <th>
                                City
                            </th>

                            <th>
                                Salary
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody>

                        ${jobs.map(job => `

                            <tr>

                                <td>
                                    ${escapeHTML(job.title)}
                                </td>

                                <td>
                                    ${escapeHTML(job.company)}
                                </td>

                                <td>
                                    ${escapeHTML(job.city)}
                                </td>

                                <td>
                                    ₹${formatSalary(job.salaryMin)}
                                    -
                                    ₹${formatSalary(job.salaryMax)}
                                </td>

                                <td>

                                    <button
                                        class="delete-btn"
                                        onclick="deleteJob(${job.id})"
                                    >
                                        Delete
                                    </button>

                                </td>

                            </tr>

                        `).join("")}

                    </tbody>

                </table>

            </div>

        </section>

    `;

}


/* =====================================================
   DELETE JOB
===================================================== */

function deleteJob(id) {

    if (
        !confirm(
            "Are you sure you want to delete this job?"
        )
    ) {
        return;
    }


    const jobs =
        getJobs()
        .filter(
            job => job.id !== id
        );


    saveJobs(jobs);


    renderAdminDashboard();

}


/* =====================================================
   ADMIN LOGOUT
===================================================== */

function adminLogout() {

    localStorage.removeItem(
        "driverHubAdmin"
    );

    showHome();

}


/* =====================================================
   INITIALIZE
===================================================== */

updateNavbar();

showHome();
